# release-plz, without the action.
#
# `release-plz/action` is a composite action that installs the release-plz
# binary through three more third-party actions and then runs it. The
# privacybydesign organization only runs GitHub-owned, verified and allowlisted
# actions, and a workflow that names any other action does not start at all, so
# this local action does the same three things itself: install the binary,
# set the git author, run the command and publish its JSON as outputs.
#
# The binaries are downloaded from their GitHub releases and checked against a
# pinned SHA-256, so a moved release asset fails the job. Bumping a
# version means bumping its checksum in the same change.
#
# Linux x86_64 only, which is every runner this is called from.
#
# The caller's step must set `GITHUB_TOKEN` in `env:`. For `release`, a job
# with `id-token: write` publishes through crates.io trusted publishing, which
# the binary negotiates itself.
name: release-plz
description: Runs `release-plz release` or `release-plz release-pr` and exposes its JSON output.
inputs:
  command:
    description: "`release` or `release-pr`."
    required: true
outputs:
  releases:
    description: The `releases` array `release-plz release` printed.
    value: ${{ steps.run.outputs.releases }}
  releases_created:
    description: Whether `release-plz release` released any package.
    value: ${{ steps.run.outputs.releases_created }}
  prs:
    description: The `prs` array `release-plz release-pr` printed.
    value: ${{ steps.run.outputs.prs }}
  pr:
    description: The first release pull request, or `{}`.
    value: ${{ steps.run.outputs.pr }}
  prs_created:
    description: Whether `release-plz release-pr` opened or updated a pull request.
    value: ${{ steps.run.outputs.prs_created }}
runs:
  using: composite
  steps:
    - name: Install release-plz
      shell: bash
      env:
        RELEASE_PLZ_VERSION: 0.4.3
        RELEASE_PLZ_SHA256: f4b0cc404cd9a58cd1b33f49e439bba65186773f63e323ea47f3ea57e557a3d3
        # Only read by `release-pr`, and only when release-plz.toml has
        # `semver_check` on.
        SEMVER_CHECKS_VERSION: 0.51.0
        SEMVER_CHECKS_SHA256: cacadafaa5cd27ae6d05a74a103266917ebab4c5e43c898360e177d4fbf06a65
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/release-plz-bin"
        mkdir -p "$bin"
        fetch() { # <url> <sha256> <binary name>
          local archive="$RUNNER_TEMP/$3.tar.gz"
          curl -sSfL --retry 3 -o "$archive" "$1"
          echo "$2  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$bin" "$3"
        }
        fetch "https://github.com/release-plz/release-plz/releases/download/release-plz-v${RELEASE_PLZ_VERSION}/release-plz-x86_64-unknown-linux-gnu.tar.gz" \
          "$RELEASE_PLZ_SHA256" release-plz
        fetch "https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v${SEMVER_CHECKS_VERSION}/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz" \
          "$SEMVER_CHECKS_SHA256" cargo-semver-checks
        "$bin/release-plz" --version

    # The commits and tags release-plz makes carry the identity behind the
    # token, as they did with the upstream action.
    - name: Configure the git author from the token
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${GITHUB_TOKEN:-}" ]]; then
          echo "::error::the step that uses this action must set GITHUB_TOKEN in env"
          exit 1
        fi
        viewer=$(gh api graphql -f query='query { viewer { name login databaseId }}' --jq '.data.viewer')
        name=$(jq -r '.name | values' <<< "$viewer")
        login=$(jq -r '.login' <<< "$viewer")
        id=$(jq -r '.databaseId' <<< "$viewer")
        git config --global user.name "${name:-$login}"
        git config --global user.email "${id}+${login}@users.noreply.github.com"

    - name: Run release-plz
      id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        # For this step only: release-plz also looks up cargo-semver-checks here.
        PATH="$RUNNER_TEMP/release-plz-bin:$PATH"
        case "$COMMAND" in
          release-pr)
            output=$(release-plz release-pr \
              --git-token "$GITHUB_TOKEN" \
              --repo-url "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}" \
              --forge github \
              -o json)
            echo "release_pr_output: $output"
            prs=$(jq -c .prs <<< "$output")
            if [[ $(jq 'length' <<< "$prs") != 0 ]]; then
              created=true
              first=$(jq -c '.[0]' <<< "$prs")
            else
              created=false
              first='{}'
            fi
            {
              echo "prs=$prs"
              echo "pr=$first"
              echo "prs_created=$created"
            } >> "$GITHUB_OUTPUT"
            ;;
          release)
            output=$(release-plz release \
              --git-token "$GITHUB_TOKEN" \
              --forge github \
              -o json)
            echo "release_output: $output"
            releases=$(jq -c .releases <<< "$output")
            if [[ $(jq 'length' <<< "$releases") != 0 ]]; then
              created=true
            else
              created=false
            fi
            {
              echo "releases=$releases"
              echo "releases_created=$created"
            } >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::unknown command '$COMMAND': expected release or release-pr"
            exit 1
            ;;
        esac
