name: Status checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

# A new push to a PR cancels the PR's previous run. Other events get a
# group of their own (run_id), so they never wait for or cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup ships with the runner image; the organization only allows
      # GitHub-owned and verified actions, so no toolchain action here.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt
          rustup default stable
      - run: cargo fmt --all --check
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup ships with the runner image; the organization only allows
      # GitHub-owned and verified actions, so no toolchain action here.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy
          rustup default stable
      - run: cargo clippy --all-targets --all-features -- -D warnings
  test:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup ships with the runner image; the organization only allows
      # GitHub-owned and verified actions, so no toolchain action here.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Install IRMA server
        env:
          IRMAGO_VERSION: v0.19.2
        run: |
          mkdir -p "$RUNNER_TEMP/irma-bin"
          echo "$RUNNER_TEMP/irma-bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/privacybydesign/irmago/releases/download/${IRMAGO_VERSION}/irma-linux-amd64" \
            -o "$RUNNER_TEMP/irma-bin/irma"
          chmod +x "$RUNNER_TEMP/irma-bin/irma"
      - name: Set up IRMA configuration
        # Pass explicit scheme URLs rather than relying on the binary's
        # compiled-in defaults: irmago < ~v0.13 pointed at the now-defunct
        # privacybydesign.foundation host, and pinning the URL here keeps
        # CI independent of any future default-URL drift.
        run: |
          mkdir -p temp_testing/client temp_testing/irma_configuration
          irma scheme download temp_testing/irma_configuration \
            https://schemes.yivi.app/irma-demo \
            https://schemes.yivi.app/pbdf
      - name: Build test client emulator
        working-directory: test_tools/client_emulator
        run: go build
      - name: Run tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: cargo test --all-features
  dependency-review:
    uses: privacybydesign/github-workflows/.github/workflows/dependency-review.yml@v1
    permissions:
      contents: read
      pull-requests: write

  workflow-lint:
    uses: privacybydesign/github-workflows/.github/workflows/workflow-lint.yml@v1
    permissions:
      contents: read

  # Single required check for the organization ruleset: job names inside this
  # workflow can change without touching the ruleset.
  passed:
    name: Status checks passed
    if: always()
    needs: [fmt, clippy, test, dependency-review, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if grep -qE '"(failure|cancelled)"' <<< "$RESULTS"; then exit 1; fi
