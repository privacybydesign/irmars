name: Release-plz

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Tag the release commit, create a GitHub release, and publish to crates.io
  # via crates.io trusted publishing (OIDC).
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Run release-plz
        uses: ./.github/actions/release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Open or update the release PR with version bumps and changelog entries.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # The release PR is opened as the org's release App when its two secrets
      # exist, and as GITHUB_TOKEN otherwise. Two things depend on the App:
      # privacybydesign does not let GITHUB_TOKEN open a pull request at all,
      # and a pull request GITHUB_TOKEN did open starts no workflows, so it
      # would arrive with every required check absent. Secrets cannot be read
      # in an `if:`, hence the step that turns one into an output.
      - name: Check for the release App
        id: app
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
        run: echo "enabled=$([ -n "$APP_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Create the release App token
        id: token
        if: steps.app.outputs.enabled == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Warn that GITHUB_TOKEN opens the release PR
        if: steps.app.outputs.enabled != 'true'
        run: echo "::warning::RELEASE_APP_ID is not set, so the release PR is opened with GITHUB_TOKEN; where the organization forbids that, this job fails."
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Run release-plz
        uses: ./.github/actions/release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token || secrets.GITHUB_TOKEN }}
